<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Plus Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="admin.webmanifest">
<meta name="theme-color" content="#0a0d12">
<link rel="icon" href="../assets/icons/staff-192.png">
<link rel="apple-touch-icon" href="../assets/icons/staff-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DP Staff">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#0a0d12;--ink-2:#2a323c;--ink-3:#5b6672;--muted:#8a94a0;--line:#e7e9ed;--line-2:#d9dde3;--bg:#f4f5f7;--card:#fff;
  --lime:#8bd13f;--green:#4e8a1c;--red:#d9363e;--amber:#b7791f;--blue:#2563c9;--wa:#25d366;
  --dark:#0a0d12;--dark-2:#121821;--dark-3:#1b232e;
  --r:16px;--sh:0 2px 4px rgba(10,13,18,.04),0 12px 32px rgba(10,13,18,.10);--ease:cubic-bezier(.2,.8,.2,1);
  --display:"Inter Tight",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
[dir=rtl] body,[dir=rtl] input,[dir=rtl] select,[dir=rtl] button,[dir=rtl] textarea{font-family:"IBM Plex Sans Arabic",Inter,sans-serif}
[dir=rtl]{--display:"IBM Plex Sans Arabic",Inter,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.app>*{min-width:0}
/* sidebar */
.side{background:var(--dark);color:#c5ced6;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand img{height:30px;filter:brightness(0) invert(1);opacity:.95}
.brand span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lime);background:rgba(139,209,63,.12);padding:3px 7px;border-radius:6px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:11px;font-weight:600;font-size:14px;color:#aeb8c2;text-align:start;transition:.15s;width:100%}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.on{background:rgba(139,209,63,.12);color:#fff}
.nav button.on svg{color:var(--lime)}
.nav .ct{margin-inline-start:auto;background:var(--lime);color:var(--ink);font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.side .foot{margin-top:auto;display:grid;gap:8px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);font-size:12.5px}
.side .foot a{color:var(--lime);font-weight:600}
.who{display:flex;align-items:center;gap:10px}
.who i{width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-style:normal;font-weight:800}
.who b{color:#fff;display:block;font-size:13px}
/* main */
.top{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20}
.top h1{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em}
.top .sub{font-size:13px;color:var(--ink-3)}
.top .sp{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.demo{font-size:12px;color:var(--ink-3);background:var(--bg);border:1px solid var(--line);padding:5px 10px;border-radius:8px;white-space:nowrap}
.btn{height:40px;padding:0 16px;border-radius:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.ink{background:var(--ink);color:#fff}.btn.ink:hover{background:var(--ink-2)}
.btn.lime{background:var(--lime);color:var(--ink)}.btn.lime:hover{background:#a6e35f}
.btn.line{border:1px solid var(--line-2);background:#fff}.btn.line:hover{border-color:var(--ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{color:var(--ink-3)}.btn.ghost:hover{color:var(--ink);background:var(--bg)}
.btn.danger{color:var(--red);border:1px solid rgba(217,54,62,.3);background:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.page{padding:24px 28px 60px;animation:fade .3s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font-size:15px;font-weight:700;margin-bottom:4px}
.card .hint{font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:4px;text-align:start;transition:.15s}
.kpi:hover{border-color:var(--ink-3)}
.kpi small{font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi b{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.hot{background:var(--dark);color:#fff;border-color:var(--dark)}
.kpi.hot small{color:#aeb8c2}.kpi.hot span{color:var(--lime)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.two>*{min-width:0}
/* chart */
.chart{position:relative;margin-top:14px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{font-size:10.5px;fill:var(--muted)}
.chart .bar{fill:var(--green);transition:opacity .15s}
.chart .hit{fill:transparent;cursor:pointer}
.chart .col:hover .bar{opacity:.75}
.chart .today .bar{fill:var(--lime)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:7px 10px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;z-index:5}
.tip b{font-family:var(--display);font-size:15px;display:block}
.tip.on{opacity:1}
/* lists */
.wl{display:grid;gap:8px;margin-top:12px}
.wi{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s}
.wi:hover{border-color:var(--ink-3)}
.wi b{font-size:13.5px}
.wi small{display:block;font-size:12px;color:var(--ink-3)}
.wi .acts{display:flex;gap:6px}
.icb{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line-2);background:#fff;color:var(--ink-2)}
.icb:hover{border-color:var(--ink)}
.icb.wa{background:rgba(37,211,102,.12);border-color:transparent;color:#16984a}
.tp{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.tp:last-child{border:0}
.tp img{width:40px;height:40px;object-fit:contain;mix-blend-mode:multiply;background:var(--bg);border-radius:8px}
/* status chips */
.st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.new{background:rgba(37,99,201,.1);color:var(--blue)}
.st.confirmed{background:rgba(183,121,31,.12);color:var(--amber)}
.st.out{background:rgba(10,13,18,.07);color:var(--ink-2)}
.st.delivered{background:rgba(78,138,28,.12);color:var(--green)}
.st.cancelled{background:var(--bg);color:var(--muted)}
/* toolbar + tabs */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs button{height:34px;padding:0 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink-3);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button em{font-style:normal;font-size:11.5px;opacity:.7}
.inp{height:40px;border:1px solid var(--line-2);border-radius:11px;padding:0 12px;background:#fff;outline:none;font-size:13.5px}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(10,13,18,.06)}
.srch{position:relative;flex:1;min-width:200px;max-width:340px}
.srch input{width:100%;padding-inline-start:36px}
.srch svg{position:absolute;inset-inline-start:11px;top:11px;color:var(--muted)}
/* tables */
.tw{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#fafbfc}
tbody tr.sel{background:rgba(139,209,63,.07)}
tbody tr.dirty td:first-child{box-shadow:inset 3px 0 0 var(--lime)}
[dir=rtl] tbody tr.dirty td:first-child{box-shadow:inset -3px 0 0 var(--lime)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:600}
.pc{display:flex;align-items:center;gap:10px;min-width:240px}
.pc img{width:40px;height:40px;object-fit:contain;mix-blend-mode:multiply;flex:none}
.pc b{font-weight:600;font-size:13.5px;line-height:1.3;display:block}
.pc small{color:var(--muted);font-size:12px}
.pin{width:96px;height:34px;border:1px solid var(--line-2);border-radius:9px;padding:0 10px;text-align:end;font-variant-numeric:tabular-nums;font-weight:700;outline:none;background:#fff}
.pin:focus{border-color:var(--ink)}
.pin.chg{border-color:var(--lime);background:rgba(139,209,63,.08)}
.ssel{height:34px;border:1px solid var(--line-2);border-radius:9px;padding:0 8px;background:#fff;font-size:12.5px;font-weight:600}
.ssel.out{color:var(--red)}.ssel.call{color:var(--amber)}
input[type=checkbox]{width:17px;height:17px;accent-color:#4e8a1c}
.chg-up{color:var(--red);font-weight:700}.chg-dn{color:var(--green);font-weight:700}
.flag{font-size:11.5px;font-weight:700;color:var(--amber);background:rgba(183,121,31,.1);padding:2px 7px;border-radius:6px;white-space:nowrap}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,13,18,.4);opacity:0;pointer-events:none;transition:.2s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100%);background:#fff;z-index:60;transform:translateX(105%);visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s;display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-105%)}
.drawer.on{transform:none!important;visibility:visible;transition:transform .3s var(--ease)}
.dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dh h3{font-family:var(--display);font-size:20px;font-weight:800}
.dh .x{margin-inline-start:auto;width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.db{flex:1;overflow:auto;padding:18px 22px;display:grid;gap:16px;align-content:start}
.blk small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:6px}
.cust{display:flex;align-items:center;gap:10px}
.cust b{font-size:15px;display:block}
.cust .acts{margin-inline-start:auto;display:flex;gap:6px}
.oi{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.oi img{width:44px;height:44px;object-fit:contain;mix-blend-mode:multiply;background:var(--bg);border-radius:8px}
.tot{display:flex;justify-content:space-between;font-weight:700;padding-top:8px}
.tot b{font-family:var(--display);font-size:22px}
.log{display:grid;gap:10px}
.log div{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:start;font-size:12.5px}
.log i{width:8px;height:8px;border-radius:50%;background:var(--line-2);margin-top:6px}
.log div:first-child i{background:var(--green)}
.log span{color:var(--muted);white-space:nowrap}
textarea.inp{height:70px;padding:10px 12px;width:100%;resize:vertical}
.df{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.df .btn.lime{flex:1}
/* save bar */
.savebar{position:fixed;bottom:20px;left:50%;transform:translate(-50%,150%);background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;z-index:40;box-shadow:0 20px 50px rgba(0,0,0,.3);transition:transform .3s var(--ease)}
.savebar.on{transform:translate(-50%,0)}
.savebar .btn.ghost{color:#aeb8c2}.savebar .btn.ghost:hover{background:rgba(255,255,255,.08);color:#fff}
.bulk{display:flex;gap:8px;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:6px 6px 6px 14px;font-size:13px;font-weight:600}
.bulk .inp{height:32px;width:70px;color:var(--ink)}
.bulk .btn{height:32px}
/* upload */
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.s3{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;align-content:start}
.s3 .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.s3.done .n{background:var(--green)}
.s3 b{font-size:14.5px}
.s3 p{font-size:12.5px;color:var(--ink-3)}
.drop{border:2px dashed var(--line-2);border-radius:14px;padding:18px;text-align:center;font-size:13px;color:var(--ink-3);cursor:pointer;transition:.15s;display:grid;gap:6px;justify-items:center}
.drop:hover,.drop.over{border-color:var(--green);background:rgba(139,209,63,.06);color:var(--ink)}
.sumrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sumrow span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.sumrow b{font-family:var(--display);font-size:17px;margin-inline-end:4px}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
/* banners */
.bn{display:grid;grid-template-columns:200px 1fr auto;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;transition:.15s}
.bn.off{opacity:.55}
.bn .th{height:110px;border-radius:12px;background:radial-gradient(70% 90% at 70% 40%,var(--g),#0a0d12 70%);display:grid;place-items:center;overflow:hidden}
.bn .th img{max-height:96px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.bn b{font-size:15px;display:block}
.bn .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.bn .meta input{height:32px;font-size:12.5px}
.ord{display:grid;gap:4px}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line-2);cursor:pointer;transition:.2s;position:absolute;inset:0}
.sw input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked{background:var(--green)}
.sw input:checked::after{inset-inline-start:21px}
.deal{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
.fld{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fld .inp{width:100%}
.dprev{background:var(--dark);color:#fff;border-radius:16px;padding:18px;display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center}
.dprev .ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--lime)}
.dprev b{font-family:var(--display);font-size:16px;display:block;margin:4px 0}
.dprev .pr{font-family:var(--display);font-size:26px;font-weight:900}
.dprev s{color:#7c8792;font-size:13px;margin-inline-start:6px}
.dprev .im{background:#fff;border-radius:12px;padding:8px;aspect-ratio:1;display:grid;place-items:center}
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:.25s var(--ease);z-index:100;pointer-events:none;display:flex;gap:8px;align-items:center}
.toast svg{color:var(--lime)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.steps3{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;z-index:30;gap:8px}
  .brand{padding:0}.brand span{display:none}
  .nav{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;flex:1}
  .nav button{height:38px;width:auto;white-space:nowrap;padding:0 10px;font-size:13px}
  .nav button .lb{display:none}.nav button.on .lb{display:inline}
  .side .foot{display:none}
  .top{position:static;padding:14px 16px;flex-wrap:wrap}
  .page{padding:16px 16px 80px}
  .bn{grid-template-columns:1fr}.bn .th{height:140px}
  .deal{grid-template-columns:1fr}
}
@media (max-width:560px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi b{font-size:24px}.top h1{font-size:20px}.demo{display:none}.savebar{inset-inline:12px;left:12px;transform:translateY(150%)}.savebar.on{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ═════ live mode ═════ */
.login{position:fixed;inset:0;z-index:100;background:radial-gradient(1200px 600px at 20% -10%,rgba(139,209,63,.18),transparent 60%),#0a0d12;display:grid;place-items:center;padding:20px}
.login[hidden]{display:none}
body.locked{overflow:hidden}
.lbox{width:100%;max-width:380px;background:#fff;border-radius:22px;padding:28px 24px;display:grid;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.lbox img{height:44px;width:auto;justify-self:start}
.lbox h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:6px}.lbox p{color:var(--ink-3);font-size:14px;margin-top:-8px}
.lbox label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.lbox .inp{height:46px;font-size:16px}
.lbox .btn.lime{height:48px;justify-content:center;font-size:15px}
.lbox .btn.ghost{justify-self:center;color:var(--ink-3)}
.lerr{color:#d9363e;font-size:13.5px;min-height:1em}
.lnk{background:none;border:0;color:inherit;opacity:.75;font:inherit;font-size:13px;cursor:pointer;padding:6px 0;text-align:start}
.demo.live{background:rgba(139,209,63,.16);color:#3f7a12}
.demo.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#4e8a1c;margin-inline-end:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}

.pushst{display:inline-flex;align-items:center;gap:8px;margin:14px 0;font-weight:600;font-size:14px;color:var(--ink-3)}.pushst::before{content:"";width:9px;height:9px;border-radius:50%;background:#c5ccd3}

function drawChart(counts){
  const W=Math.max(300,Math.min(640,Math.round($('#chart').clientWidth||640))),H=W<500?240:300,step=W<500?3:2,pl=28,pb=26,pt=10,max=Math.max(5,Math.ceil(Math.max(...counts)/5)*5),n=counts.length,bw=(W-pl)/n;
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  const days=counts.map((_,i)=>{const d=new Date(TODAY);d.setDate(d.getDate()-(n-1-i));return d});
  const lbl=d=>d.toLocaleDateString(lang==='ar'?'ar-SY':'en-GB',{day:'numeric',month:'short'});
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('Orders per day, last 14 days','الطلبات يومياً')}">`;
  for(let g=0;g<=max;g+=5)s+=`<line class="gl" x1="${pl}" x2="${W}" y1="${y(g)}" y2="${y(g)}"/><text class="ax" x="${pl-8}" y="${y(g)+3.5}" text-anchor="end">${g}</text>`;
  counts.forEach((c,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6,yt=y(c),hgt=H-pb-yt,r=Math.min(4,hgt);
    s+=`<g class="col ${i===n-1?'today':''}" data-i="${i}"><path class="bar" d="M${x} ${H-pb}V${yt+r}q0 -${r} ${r} -${r}h${w-2*r}q${r} 0 ${r} ${r}V${H-pb}z"/><rect class="hit" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}"/>${(n-1-i)%step?'':`<text class="ax" x="${x+w/2}" y="${H-8}" text-anchor="middle">${lbl(days[i])}</text>`}</g>`});
  s+='</svg><div class="tip" id="tip"></div>';
  const el=$('#chart');el.innerHTML=s;
  el.querySelectorAll('.col').forEach(g=>{g.onmouseenter=()=>{const i=+g.dataset.i,tip=$('#tip'),r=el.getBoundingClientRect(),br=g.querySelector('.bar').getBoundingClientRect();
    tip.innerHTML=`<b>${counts[i]} ${L('orders','طلب')}</b>${lbl(days[i])}${i===n-1?L(' · today',' · اليوم'):''}`;tip.style.left=(br.left-r.left+br.width/2)+'px';tip.style.top=(br.top-r.top-6)+'px';tip.classList.add('on')};
    g.onmouseleave=()=>$('#tip').classList.remove('on')});
}

function readFile(f){

  const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});buildImport(rows,f.name)}catch(err){toast(L('Could not read that file','تعذّرت قراءة الملف'))}};r.readAsArrayBuffer(f);

function buildImport(rows,fname){
  const key=o=>{const m={};for(const k in o)m[k.trim().toLowerCase()]=o[k];return m};
  const out=[];
  const CATK={lap:'lap',laptop:'lap',laptops:'lap','لابتوب':'lap',gpu:'gpu','graphics cards':'gpu','graphics card':'gpu',mon:'mon',monitor:'mon',monitors:'mon',mb:'mb',motherboard:'mb',motherboards:'mb',cpu:'cpu',cpus:'cpu',processor:'cpu',processors:'cpu',ram:'ram',memory:'ram',acc:'acc',accessory:'acc',accessories:'acc'};
  const STD=['id','name','price','old_price','stock','category','series','image','السعر','الاسم'];
  rows.map(key).forEach(r=>{const price=parseFloat(String(r.price??r['السعر']??'').replace(/[^\d.]/g,''));
    const name=String(r.name||r['الاسم']||'').trim(),cat=CATK[String(r.category||'').trim().toLowerCase()];
    const extra={};for(const k in r)if(!STD.includes(k)&&r[k]!==''&&r[k]!=null){const v=r[k];extra[k.replace(/\s+/g,'_')]=typeof v==='number'?v:String(v).trim()}
    const full={id:+r.id||undefined,name:name||undefined,price:isNaN(price)?undefined:price,old_price:r.old_price!==''&&r.old_price!=null?r.old_price:undefined,stock:r.stock||undefined,cat,series:r.series||undefined,image:r.image?String(r.image).trim():undefined,attrs:Object.keys(extra).length?extra:undefined};
    const p=byId(+r.id)||P.find(x=>x.n.toLowerCase()===name.toLowerCase());
    if(!p){if(API&&name&&cat&&!isNaN(price))out.push({add:true,label:name,price,full,on:true,cat});else if(r.id||name)out.push({miss:true,label:name||('#'+r.id),price});return}
    if(isNaN(price)&&!full.image&&!full.attrs&&!full.stock)return;
    const np=isNaN(price)?p.p:price,ch=p.p?(np-p.p)/p.p:1,same=np===p.p&&!(full.image&&full.image!==p.f)&&!full.attrs&&!(full.stock&&full.stock!==p.stock);
    out.push({p,price:np,ch,same,big:Math.abs(ch)>.2,on:!same&&Math.abs(ch)<=.2,full});
  });
  imp={fname,rows:out};pImport();
}

async function api(method,url,body){
  const r=await fetch(url,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&!url.includes('/auth/')){showLogin();throw new Error(L('Please sign in again','يرجى تسجيل الدخول مجدداً'))}
  if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
const CATL={lap:'Laptops',gpu:'Graphics cards',mon:'Monitors',mb:'Motherboards',cpu:'CPUs',ram:'Memory',acc:'Accessories'};
const mapProduct=x=>({id:x.id,n:x.n,c:CATL[x.c]||x.c,cat:x.c,se:x.se,p:x.p,o:x.o||0,f:x.f,stock:x.stock,upd:x.upd,attrs:x.attrs,watch:x.watch||{}});
const LOGAR={'Order placed on the website':'تم الطلب عبر الموقع','Confirmed after call':'تم التأكيد بعد الاتصال','Sent out for delivery':'أُرسل للتوصيل','Delivered, cash received':'تم التسليم واستلام النقود','Cancelled':'أُلغي الطلب','Note updated':'عُدّلت الملاحظة'};
const toDate=s=>new Date(String(s).replace(' ','T')+(/Z|\+/.test(s)?'':'Z'));
const mapOrder=o=>({no:o.no,name:o.name,phone:o.phone,city:o.city,area:[o.area,o.street].filter(Boolean).join(' · '),pickup:o.method==='pickup',notes:o.notes,subs:o.subs,
  items:o.items.map(i=>({id:i.id,q:i.qty,name:i.name,price:i.price})),status:o.status,placed:toDate(o.created_at),note:o.staff_note||'',
  log:o.log.map(l=>{const [base,who]=l.text.split(' · ');return {t:toDate(l.at),en:l.text,ar:(LOGAR[base]||base)+(who?' · '+who:'')}})});
function mergeOrder(o){const m=mapOrder(o),i=orders.findIndex(x=>x.no===m.no);if(i>=0)orders[i]=m;else orders.unshift(m);return m}
async function loadProducts(){const list=await api('GET','/api/admin/products');P.splice(0,P.length,...list.map(mapProduct))}
let lastNew=null;
async function loadOrders(quiet){const list=await api('GET','/api/admin/orders');const before=new Set(orders.map(o=>o.no));orders.splice(0,orders.length,...list.map(mapOrder));
  const fresh=quiet&&lastNew!==null?orders.filter(o=>!before.has(o.no)):[];lastNew=orders.length;
  if(fresh.length){toast(L(`New order ${fresh[0].no} · ${fresh[0].name}`,`طلب جديد ${fresh[0].no} · ${fresh[0].name}`));try{new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play()}catch{}}
  return fresh.length}
function showLogin(){$('#login').hidden=false;document.body.classList.add('locked');setTimeout(()=>$('#luser').focus(),50)}
function loginText(){$('#lt').textContent=L('Staff sign in','دخول الموظفين');$('#ls').textContent=L('Orders, products and prices for the Digital Plus team.','الطلبات والمنتجات والأسعار لفريق ديجيتال بلس.');$('#lu').textContent=L('Username','اسم المستخدم');$('#lp').textContent=L('Password','كلمة المرور');$('#lgo').textContent=L('Sign in','دخول');$('#llang').textContent=lang==='ar'?'English':'عربي'}
$('#llang').onclick=()=>$('#lang').click();
$('#lform').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';$('#lgo').disabled=true;
  try{const r=await api('POST','/api/auth/login',{username:$('#luser').value,password:$('#lpass').value});ME=r.user;$('#lpass').value='';await startLive()}
  catch(err){$('#lerr').textContent=err.message}$('#lgo').disabled=false};
$('#logout').onclick=async()=>{try{await api('POST','/api/auth/logout',{})}catch{}ME=null;orders.splice(0);P.splice(0);showLogin()};
const ROLEN={owner:['Owner','المالك'],manager:['Manager','مدير'],sales:['Sales','مبيعات']};
function whoText(){if(!API||!ME)return;$('#whoN').textContent=ME.name;$('#whoR').textContent=L(...ROLEN[ME.role])+' · @'+ME.username;$('.who i').textContent=(ME.name[0]||'S').toUpperCase();$('#logout').textContent=L('Sign out','تسجيل الخروج')}
let poll=null;
async function startLive(){
  await Promise.all([loadProducts(),loadOrders()]);
  $('#login').hidden=true;document.body.classList.remove('locked');$('#logout').hidden=false;
  $('#demoTag').textContent=L('Live','مباشر');$('#demoTag').classList.add('live');whoText();render();
  clearInterval(poll);poll=setInterval(async()=>{if(document.hidden||!ME)return;try{if(await loadOrders(true)){renderNav();if(view==='orders')fillOrders();if(view==='overview')pOverview()}}catch{}},30000);
}
async function boot(){
  let me=null;
  if(/^https?:$/.test(location.protocol)){try{const r=await fetch('/api/auth/me',{headers:{accept:'application/json'}});if(r.ok&&/json/.test(r.headers.get('content-type')||''))me=await r.json()}catch{}}
  if(!me){render();return false}
  API=true;orders.splice(0);P.splice(0);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  if(me.user){ME=me.user;await startLive()}else{loginText();showLogin()}
  return true;
}

/* team (owner only) */
let users=[];
async function pTeam(){
  $('#page').innerHTML=`<div class="card"><p class="hint">${L('Loading…','جارٍ التحميل…')}</p></div>`;
  try{users=await api('GET','/api/admin/users')}catch(e){$('#page').innerHTML=`<div class="card">${esc(e.message)}</div>`;return}
  const RD={owner:L('Everything, including team logins','كل شيء، بما فيه حسابات الفريق'),manager:L('Orders, prices, stock, imports, banners','الطلبات والأسعار والتوفر والاستيراد والبانرات'),sales:L('Orders only — call, confirm, deliver','الطلبات فقط — اتصال وتأكيد وتوصيل')};
  $('#page').innerHTML=`<div class="two"><div class="card"><h3>${L('People who can sign in','الأشخاص المسموح لهم بالدخول')}</h3><div class="hint" style="margin-bottom:10px">${users.length} ${L('accounts','حسابات')}</div>
    <div class="tw" style="border:0"><table><tbody>${users.map(u=>`<tr class="${u.active?'':'off'}"><td><b style="font-weight:600">${esc(u.name)}</b><div style="font-size:12px;color:var(--muted)">@${esc(u.username)}${u.id===ME.id?L(' · you',' · أنت'):''}</div></td>
      <td><select class="inp" onchange="setUser(${u.id},{role:this.value})" ${u.id===ME.id?'disabled':''}>${['owner','manager','sales'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${L(...ROLEN[r])}</option>`).join('')}</select></td>
      <td style="white-space:nowrap;text-align:end">${u.id===ME.id?'':`<button class="btn line sm" onclick="resetPw(${u.id},'${esc(u.username)}')">${L('New password','كلمة مرور جديدة')}</button> <button class="btn ${u.active?'danger':'line'} sm" onclick="setUser(${u.id},{active:${!u.active}})">${u.active?L('Turn off','إيقاف'):L('Turn on','تفعيل')}</button>`}</td></tr>`).join('')}</tbody></table></div></div>
   <div class="card"><h3>${L('Add a person','إضافة شخص')}</h3><div class="hint" style="margin-bottom:12px">${L('Give them the username and password in person or by phone.','أعطه اسم المستخدم وكلمة المرور شخصياً أو بالهاتف.')}</div>
    <form id="uform" class="grid" style="gap:10px"><label class="fld">${L('Full name','الاسم الكامل')}<input class="inp" name="name" required></label>
     <label class="fld">${L('Username','اسم المستخدم')}<input class="inp" name="username" required pattern="[a-zA-Z0-9._\\-]{3,40}" autocapitalize="none" autocomplete="off"></label>
     <label class="fld">${L('Password (8+ characters)','كلمة المرور (8 أحرف على الأقل)')}<input class="inp" name="password" type="password" minlength="8" required autocomplete="new-password"></label>
     <label class="fld">${L('Role','الدور')}<select class="inp" name="role">${['sales','manager','owner'].map(r=>`<option value="${r}">${L(...ROLEN[r])} — ${RD[r]}</option>`).join('')}</select></label>
     <button class="btn ink">${L('Add account','إضافة الحساب')}</button></form></div></div>
   <div class="card" style="margin-top:16px"><h3>${L('What each role can do','صلاحيات كل دور')}</h3><div class="roles">${['owner','manager','sales'].map(r=>`<div><b>${L(...ROLEN[r])}</b><span>${RD[r]}</span></div>`).join('')}</div></div>`;
  $('#uform').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{await api('POST','/api/admin/users',f);toast(L('Account added','أُضيف الحساب'));pTeam()}catch(err){toast(err.message)}};
}
async function setUser(id,b){try{await api('PATCH','/api/admin/users/'+id,b);toast(L('Saved','تم الحفظ'))}catch(e){toast(e.message)}pTeam()}
async function resetPw(id,u){const pw=prompt(L(`New password for @${u} (8+ characters):`,`كلمة مرور جديدة لـ @${u} (8 أحرف على الأقل):`));if(!pw)return;setUser(id,{password:pw})}

/* exchange rate + notifications on this device */
function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
async function staffPush(btn){
  try{if(!('serviceWorker' in navigator)||!('PushManager' in window))throw new Error(isIOS&&!isApp()?L('On iPhone: tap Share → “Add to Home Screen”, open DP Staff from the home screen, sign in, then tap this again.','على الآيفون: اضغط مشاركة ← “إضافة إلى الشاشة الرئيسية”، افتح DP Staff من الشاشة الرئيسية، سجّل الدخول، ثم اضغط هنا مجدداً.'):L('This browser can’t receive notifications. Use Chrome on Android or a computer.','هذا المتصفح لا يستقبل الإشعارات. استخدم Chrome على أندرويد أو الكمبيوتر.'));
    if(await Notification.requestPermission()!=='granted')throw new Error(L('Notifications are blocked. Allow them in the browser settings for this site.','الإشعارات محظورة. اسمح بها من إعدادات المتصفح لهذا الموقع.'));
    const st=await api('GET','/api/admin/settings');const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(st.push_key)});
    await api('POST','/api/push/subscribe',{kind:'staff',subscription:sub.toJSON(),lang});
    const t=await api('POST','/api/push/test',{});toast(t.sent?L('Done — a test notification is on its way','تم — إشعار تجريبي في الطريق'):L('Turned on','تم التفعيل'));pSettings()}
  catch(e){alert(e.message)}}
async function pSettings(){
  $('#page').innerHTML=`<div class="card"><p class="hint">${L('Loading…','جارٍ التحميل…')}</p></div>`;
  let st;try{st=await api('GET','/api/admin/settings')}catch(e){$('#page').innerHTML=`<div class="card">${esc(e.message)}</div>`;return}
  const mine=('serviceWorker' in navigator)&&('PushManager' in window)?await navigator.serviceWorker.ready.then(r=>r.pushManager.getSubscription()).catch(()=>null):null;
  const can=ME&&ME.role!=='sales';
  $('#page').innerHTML=`${st.data_persistent===false?`<div class="warnbar">${L('Data is not on a saved volume — orders and accounts will be lost on the next deploy. Add persistent storage at /data in Coolify.','البيانات ليست على تخزين دائم — ستُفقد الطلبات والحسابات عند النشر التالي. أضف تخزيناً دائماً على /data في Coolify.')}</div>`:''}
  <div class="two"><div class="card"><h3>${L('Dollar rate','سعر الدولار')}</h3><div class="hint">${L('Used to show prices in Syrian pounds on the store','يُستخدم لعرض الأسعار بالليرة السورية على المتجر')}</div>
    <div class="rate"><small>1 USD =</small><b>${st.rate?st.rate.toLocaleString('en-US'):'—'}</b><small>SYP</small></div>
    <div class="hint">${st.rate_at?L('Updated ','آخر تحديث ')+ago(new Date(st.rate_at))+' · '+esc(st.rate_source||''):L('Not set yet — SYP prices are hidden on the store','لم يُحدد بعد — أسعار الليرة مخفية على المتجر')}</div>
    ${st.rate_pending?`<div class="warnbar" style="margin-top:12px">${L(`The rate service sent ${(+st.rate_pending).toLocaleString('en-US')}, a big jump. Check it, then type it below to accept.`,`أرسلت خدمة الصرف ${(+st.rate_pending).toLocaleString('en-US')}، وهي قفزة كبيرة. تحقق منها ثم اكتبها أدناه للموافقة.`)}</div>`:''}
    ${can?`<form id="rform" style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><input class="inp" id="rnew" type="number" step="any" min="1" placeholder="${L('New rate','السعر الجديد')}" style="flex:1;min-width:140px" required><button class="btn ink">${L('Save rate','حفظ السعر')}</button>${st.rate_api?`<button type="button" class="btn line" id="rref">${L('Fetch now','جلب الآن')}</button>`:''}</form>
    <div class="hint" style="margin-top:8px">${st.rate_api?L('Updated automatically every hour from the rate service.','يُحدَّث تلقائياً كل ساعة من خدمة الصرف.'):L('No rate service connected — set it by hand, or add EXCHANGE_API_URL in Coolify.','لا توجد خدمة صرف مربوطة — أدخله يدوياً أو أضف EXCHANGE_API_URL في Coolify.')}</div>`:''}</div>
   <div class="card"><h3>${L('New-order alerts on this device','تنبيهات الطلبات الجديدة على هذا الجهاز')}</h3><div class="hint">${L('Your phone buzzes the moment a customer orders, even when the app is closed.','يرن هاتفك لحظة طلب الزبون، حتى والتطبيق مغلق.')}</div>
    <div class="pushst ${mine?'on':''}">${mine?L('On for this device','مفعّلة على هذا الجهاز'):L('Off for this device','غير مفعّلة على هذا الجهاز')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn lime" onclick="staffPush(this)">${mine?L('Send a test','إرسال تجربة'):L('Turn on alerts','تفعيل التنبيهات')}</button></div>
    <ol class="steps-i"><li>${L('On the phone, open this page and add it to the home screen (Android: menu → Install app · iPhone: Share → Add to Home Screen).','على الهاتف، افتح هذه الصفحة وأضفها للشاشة الرئيسية (أندرويد: القائمة ← تثبيت التطبيق · آيفون: مشاركة ← إضافة إلى الشاشة الرئيسية).')}</li><li>${L('Open DP Staff from the home screen and sign in.','افتح DP Staff من الشاشة الرئيسية وسجّل الدخول.')}</li><li>${L('Come here and tap “Turn on alerts”.','ادخل هنا واضغط “تفعيل التنبيهات”.')}</li></ol>
    <div class="hint">${st.staff_devices} ${L('staff devices','أجهزة للموظفين')} · ${st.customer_devices} ${L('customer devices get alerts','أجهزة زبائن تستقبل التنبيهات')}</div></div></div>
  <div class="card" style="margin-top:16px;max-width:520px"><h3>${L('Change my password','تغيير كلمة المرور')}</h3><form id="pwform" class="grid" style="gap:10px;margin-top:10px"><input class="inp" type="password" name="current" placeholder="${L('Current password','كلمة المرور الحالية')}" required autocomplete="current-password"><input class="inp" type="password" name="password" minlength="8" placeholder="${L('New password (8+ characters)','كلمة المرور الجديدة (8 أحرف على الأقل)')}" required autocomplete="new-password"><button class="btn ink">${L('Change password','تغيير')}</button></form></div>`;
  if($('#rform'))$('#rform').onsubmit=async e=>{e.preventDefault();try{await api('PUT','/api/admin/settings/rate',{rate:+$('#rnew').value});toast(L('Rate saved — the store shows it now','حُفظ السعر — يظهر على المتجر الآن'));pSettings()}catch(err){toast(err.message)}};
  if($('#rref'))$('#rref').onclick=async()=>{const r=await api('POST','/api/admin/settings/rate/refresh',{}).catch(e=>({error:e.message}));toast(r.ok?L('Rate updated','تم تحديث السعر'):(r.error||'Failed'));pSettings()};
  $('#pwform').onsubmit=async e=>{e.preventDefault();try{await api('POST','/api/admin/me/password',Object.fromEntries(new FormData(e.target)));toast(L('Password changed','تم تغيير كلمة المرور'));e.target.reset()}catch(err){toast(err.message)}};
}

/* ───────── boot ───────── */
$('#lang').onclick=()=>{lang=lang==='en'?'ar':'en';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#lang').textContent=lang==='ar'?'English':'عربي';
  $('#demoTag').textContent=API?L('Live','مباشر'):L('Demo · sample orders','تجريبي · طلبات نموذجية');$('#whoN').textContent=L('Sales team','فريق المبيعات');$('#whoR').textContent=L('Damascus branch','فرع دمشق');$('#toStore').textContent=L('↗ Open the store','↗ افتح المتجر');whoText();loginText();
  closeDrawer();render();if(curOrder&&$('#drawer').classList.contains('on'))drawOrder()};
addEventListener('hashchange',()=>{const h=location.hash.slice(1).split('/');if(VIEWS[h[0]]&&h[0]!==view){view=h[0];render()}if(h[0]==='orders'&&h[1]&&orders.find(o=>o.no===h[1]))openOrder(h[1])});
{const h=location.hash.slice(1).split('/');if(VIEWS[h[0]])view=h[0]}
boot().then(live=>{const h=location.hash.slice(1).split('/');if(live&&h[0]==='orders'&&h[1]&&orders.find(o=>o.no===h[1]))openOrder(h[1]);if(live)return;
{const dm=new URLSearchParams(location.search).get('demo')||'';
 if(dm.includes('ar')){$('#lang').click()}
 if(dm.includes('order')){openOrder(orders.find(o=>o.status==='new').no)}
 if(dm.includes('import')){view='import';render();sample()}}
});
</script>
